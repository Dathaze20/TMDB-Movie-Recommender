name: Build Android APK

on:
  push:
    branches: [main]
  # Build the APK on pull requests too, so a change is proven to produce a
  # working package before it reaches main. The release step below is skipped
  # for these runs - only main publishes.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The first run downloads the Android SDK/NDK, so allow plenty of headroom.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # libltdl-dev is not optional: python-for-android's libffi recipe runs
      # autoreconf on libffi 3.4.2, whose configure.ac calls
      # LT_SYS_SYMBOL_USCORE. That macro lives in /usr/share/aclocal/ltdl.m4,
      # which only libltdl-dev installs - without it autoreconf fails with
      # "possibly undefined macro" and the whole build dies. The recipe's own
      # docstring calls this out.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev ccache

      - name: Verify libffi's autoreconf macro is available
        run: |
          grep -rl 'AC_DEFUN(\[LT_SYS_SYMBOL_USCORE\]' /usr/share/aclocal/ \
            || { echo "::error::LT_SYS_SYMBOL_USCORE missing; the libffi recipe will fail"; exit 1; }

      # Catches a p4a footgun in seconds instead of ~19 minutes into the build.
      - name: Check pip requirements are not hyphenated
        run: |
          python3 - <<'PY'
          import configparser, re, sys
          cfg = configparser.ConfigParser()
          cfg.read('buildozer.spec')
          reqs = [r.strip() for r in cfg['app']['requirements'].split(',') if r.strip()]
          # These are p4a recipes, not pip installs, so the rule does not apply.
          recipes = {'python3', 'kivy', 'openssl', 'sdl2', 'sdl3', 'pyjnius',
                     'android', 'sqlite3', 'png', 'freetype', 'libffi'}
          bad = [r for r in reqs
                 if re.split(r'[=<>!~]', r, 1)[0].strip().lower() not in recipes
                 and '-' in re.split(r'[=<>!~]', r, 1)[0]]
          if bad:
              print(f"::error::Hyphenated pip requirement(s) in buildozer.spec: {bad}. "
                    "python-for-android matches wheel names normalised to underscores "
                    "against requirement names as written, so a hyphen makes it append "
                    "the resolved wheel URL alongside your pin, and pip fails with "
                    "ResolutionImpossible. Spell these with underscores.")
              sys.exit(1)
          print("requirements OK:", reqs)
          PY

      # p4a happily resolves an Android wheel, then installs the requirements
      # with a plain host pip that has no --platform flag and rejects it
      # ("not a supported wheel on this platform"). Only py3-none-any wheels
      # survive that round trip, so refuse anything publishing Android wheels.
      - name: Check pip requirements ship pure-Python wheels
        run: |
          python3 - <<'PY'
          import configparser, json, re, sys, urllib.request
          cfg = configparser.ConfigParser()
          cfg.read('buildozer.spec')
          reqs = [r.strip() for r in cfg['app']['requirements'].split(',') if r.strip()]
          recipes = {'python3', 'kivy', 'openssl', 'sdl2', 'sdl3', 'pyjnius',
                     'android', 'sqlite3', 'png', 'freetype', 'libffi'}
          bad = []
          for spec in reqs:
              name = re.split(r'[=<>!~]', spec, 1)[0].strip()
              if name.lower() in recipes:
                  continue
              try:
                  url = f"https://pypi.org/pypi/{name.replace('_', '-')}/json"
                  data = json.load(urllib.request.urlopen(url, timeout=30))
              except Exception as e:
                  print(f"  {name}: could not check ({e}) - skipping")
                  continue
              ver = data['info']['version']
              whls = [f['filename'] for f in data['releases'].get(ver, [])
                      if f['filename'].endswith('.whl')]
              android = [w for w in whls if 'android' in w]
              pinned = any(c in spec for c in '=<>!~')
              print(f"  {name}: latest {ver}, android wheels: {len(android)}"
                    f"{' (pinned)' if pinned else ''}")
              # Only a problem when we are NOT pinning away from it.
              if android and not pinned:
                  bad.append(f"{name} (latest {ver})")
          if bad:
              print(f"::error::These requirements publish Android wheels: {bad}. "
                    "p4a resolves them but its install step uses a host pip with no "
                    "--platform flag and rejects them. Pin to a version that ships "
                    "only py3-none-any wheels.")
              sys.exit(1)
          PY

      # A package missing from buildozer.spec builds a perfectly good APK that
      # then dies on the phone with an ImportError at startup. Fail here, with
      # the package named, rather than there with a black screen.
      - name: Check every import is declared in buildozer.spec
        run: python tools/check_requirements.py

      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -q

      # cython<3.2 is the ceiling python-for-android's pyjnius recipe
      # declares; its kivy and android recipes only require >=0.29.1.
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.6.0 "cython<3.2"

      # The SDK/NDK download is multi-GB and dominates build time, so cache it.
      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-v4-${{ runner.os }}-

      - name: Cache compiled recipes
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-local-v4-${{ runner.os }}-

      # buildozer.spec bundles .env via source.include_patterns, so setting a
      # TMDB_API_KEY repository secret ships the APK pre-configured. There is
      # no key compiled into the source any more, so without the secret the
      # app asks for one on its setup screen and stores it on the device.
      - name: Write .env from secret
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ]; then
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > .env
            echo "TMDB_API_KEY secret found - bundling it into the APK."
          else
            echo "No TMDB_API_KEY secret - the app will ask for a key on first launch."
          fi

      # Every CI runner generates its own throwaway debug keystore, so each
      # build was signed with a different key. Android refuses to install an
      # APK over one signed by a different key, so every update meant
      # uninstalling the app first and losing the local watchlist. Restoring a
      # fixed keystore makes the signature stable for good.
      #
      # The Gradle build resolves the debug keystore from ANDROID_PREFS_ROOT,
      # falling back to the home directory. buildozer 1.6.0 sets neither that
      # nor ANDROID_SDK_HOME, so ~/.android/debug.keystore is what it uses;
      # ANDROID_PREFS_ROOT is still set below so a future version cannot
      # quietly redirect it somewhere else.
      #
      # This keystore is a debug key and nothing more. It carries no trust,
      # cannot publish to Play, and exists only so successive builds keep the
      # same identity. It is still kept in a secret rather than committed, so
      # the repository holds no credential-shaped file.
      - name: Restore the signing keystore
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_DEBUG_KEYSTORE_B64:-}" ]; then
            echo "::error::The ANDROID_DEBUG_KEYSTORE_B64 repository secret is not set."
            echo "Without it this build would sign the APK with a throwaway key,"
            echo "and the result would not install over the previous release."
            echo "Add it under Settings > Secrets and variables > Actions >"
            echo "New repository secret, then re-run this workflow."
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          if ! keytool -list -keystore ~/.android/debug.keystore \
               -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "::error::The restored keystore could not be read."
            echo "It must be a JKS keystore with alias 'androiddebugkey' and"
            echo "store/key password 'android', base64-encoded."
            exit 1
          fi
          # Recorded so the fingerprint can be compared across builds at a glance.
          keytool -list -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey | grep 'SHA256:'
          keytool -list -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey \
            | grep 'SHA256:' | awk '{print $2}' > "$RUNNER_TEMP/expected-fingerprint.txt"

      - name: Build debug APK
        run: |
          export ANDROID_PREFS_ROOT="$HOME"
          buildozer -v android debug

      - name: Show artifacts
        run: ls -lh bin/

      # A green build that silently fell back to a different key would produce
      # an APK that cannot be installed over the last one - the exact failure
      # this change exists to prevent. Check it rather than assume it.
      - name: Verify the APK is signed with the expected key
        run: |
          set -euo pipefail
          APK=$(ls bin/*.apk | head -1)
          python tools/apk_signature.py "$APK" --expect "$(cat "$RUNNER_TEMP/expected-fingerprint.txt")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-movie-recommender-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 90

      # Artifacts expire, and they download as a .zip that has to be unpacked
      # before Android will touch the .apk inside. A release asset never
      # expires and downloads as the .apk itself, so the phone can install it
      # straight from the browser. The "latest" tag is reused every build, so
      # the link below is permanent:
      #   https://github.com/Dathaze20/TMDB-Movie-Recommender/releases/latest
      #
      # The release is recreated rather than having its asset replaced in
      # place. Uploading over an existing release leaves its original publish
      # date untouched, so the page kept showing the date the tag was first
      # cut - "1mo ago" on top of an APK built minutes earlier, with no way
      # for a reader to tell which file was actually there. Recreating it
      # costs a second and makes the date mean what it says.
      - name: Publish APK to a permanent release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(ls bin/*.apk | head -1)
          BUILT_AT=$(date -u '+%Y-%m-%d %H:%M UTC')
          FINGERPRINT=$(cat "$RUNNER_TEMP/expected-fingerprint.txt")
          echo "Publishing $APK"

          gh release delete latest --yes --cleanup-tag || true

          gh release create latest "$APK" \
            --target "$GITHUB_SHA" \
            --title "Latest APK" \
            --notes "$(cat <<EOF
          Debug APK built automatically from \`main\`. Download the \`.apk\` below and tap it on your phone.

          | | |
          |---|---|
          | Built | $BUILT_AT |
          | Commit | \`$GITHUB_SHA\` |
          | Signing key (SHA-256) | \`$FINGERPRINT\` |

          The signing key is the same for every build, so this installs over the previous version without uninstalling first.
          EOF
          )"
          echo "Available at https://github.com/${GITHUB_REPOSITORY}/releases/latest"
